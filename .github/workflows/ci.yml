name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 22.23.5 bundles npm 10.9.9. Node 24 bundles npm >= 11.5.1.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-publish-runtime.mjs
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
